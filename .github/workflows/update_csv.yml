name: Update Schedule CSV

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-python-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests urllib3

      - name: Decompress & Write CSV
        run: python update_csv.py

      - name: Force Push Single Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout --orphan latest_temp
          
          # Stage only the files that actually exist
          git add schedule.csv update_csv.py .github/
          
          git commit -m "Auto-update schedule [latest]"
          
          git branch -D main || true
          git branch -m main
          git push -f origin main
